# nginx config for the OpenVault frontend container.
# - serves the built React app
# - forwards /api/... to the backend container, so the browser only ever
#   talks to one origin (no CORS needed in production)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Large uploads: keep this a bit above MAX_UPLOAD_MB in .env.
    client_max_body_size 110m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API -> backend service (name from docker-compose.yml).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream uploads/downloads instead of buffering whole files in nginx.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Built JS/CSS have a content hash in their name -> cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Single-page app: unknown paths (/app/files/3, /s/abc...) load index.html
    # and React Router shows the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
