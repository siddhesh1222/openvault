<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpenVault — self-hostable, open source file sharing and backup." />
    <meta name="theme-color" content="#4f46e5" />
    <title>OpenVault</title>
    <script>
      // Apply the saved theme before React loads, so a dark-mode user never
      // sees a white flash on page load.
      (function () {
        try {
          var theme = localStorage.getItem("ov_theme") || "system";
          var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
